[project]
name = "sera-solver"
version = "0.1.0"
description = "Scientific engine for SERA: sparse-sensing state estimation, paddy water demand, service ledger, and equitable rolling allocation for tertiary irrigation."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "SERA Team" }]
keywords = ["irrigation", "water-allocation", "state-estimation", "optimization-under-uncertainty", "paddy", "sparse-sensing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]

dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings>=2.13",
  "structlog>=25.4",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "ortools==9.15.6755",
  "highspy==1.15.1",
  "pykalman==0.11.2",
]

[project.optional-dependencies]
scip = ["pyscipopt>=5.5"]
otel = ["opentelemetry-sdk==1.45.0", "opentelemetry-exporter-otlp==1.45.0"]

[project.scripts]
sera-exp = "app.cli:main"

[build-system]
requires = ["hatchling>=1.30"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "quality" }]
test = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "pytest-xdist>=3.8",
  "pytest-timeout>=2.4",
  "hypothesis>=6.138",
  "httpx>=0.28",
]
quality = [
  "ruff>=0.16",
  "pyright>=1.1.400",
]

[tool.uv]
required-version = ">=0.11.7"
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["app", "api", "simulator", "estimator", "optimizer", "sensing", "baselines", "experiments"]

[tool.hatch.build.targets.sdist]
include = ["app", "api", "simulator", "estimator", "optimizer", "sensing", "baselines", "experiments", "tests", "pyproject.toml", "README.md"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RET", "RUF", "ANN", "NPY", "PD", "PERF", "ERA", "G", "LOG", "FURB", "FLY"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "api", "simulator", "estimator", "optimizer", "sensing", "baselines", "experiments"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["app", "api", "simulator", "estimator", "optimizer", "sensing", "baselines", "experiments", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "--durations=10"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "integration: menyentuh FastAPI app atau I/O nyata",
  "experiment: menjalankan runner eksperimen (menit)",
  "slow: durasi lebih dari dua detik",
  "hil: butuh hardware atau broker MQTT",
]

[tool.coverage.run]
branch = true
source = ["app", "api", "simulator", "estimator", "optimizer", "sensing", "baselines", "experiments"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]